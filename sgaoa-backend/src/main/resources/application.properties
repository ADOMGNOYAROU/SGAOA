# --- Serveur ---
server.port=8081
spring.application.name=sgaoa-backend

# --- Base de données MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/sgaoa_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Console H2 (désactivée pour MySQL) ---
# spring.h2.console.enabled=false
# spring.h2.console.path=/h2-console

# --- JWT ---
app.jwt.secret=sgaoa_secret_key_must_be_at_least_256_bits_long_for_HS256_algorithm_togo_2024
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# --- CORS ---
app.cors.allowed-origins=http://localhost:4200

# --- Logs ---
logging.level.com.sgaoa=DEBUG
logging.level.org.springframework.security=INFO