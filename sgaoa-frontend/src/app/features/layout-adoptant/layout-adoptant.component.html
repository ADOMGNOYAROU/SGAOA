<div class="min-h-screen bg-[#FAFAF8] flex">
  <!-- Sidebar -->
  <aside
    [class]="isSidebarCollapsed() ? 'w-20 bg-white shadow-lg border-r border-gray-100 fixed left-0 top-0 h-full z-50 hidden lg:block transition-all duration-300' : 'w-64 bg-white shadow-lg border-r border-gray-100 fixed left-0 top-0 h-full z-50 hidden lg:block transition-all duration-300'">
    <!-- Logo Section -->
    <div class="p-6 border-b border-gray-100 flex items-center justify-between">
      <div class="flex items-center gap-3" [class]="isSidebarCollapsed() ? 'justify-center w-full' : ''">
        <div class="w-10 h-10 rounded-full bg-[#4A7C59] flex items-center justify-center flex-shrink-0">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
            </path>
          </svg>
        </div>
        <div [class]="isSidebarCollapsed() ? 'hidden' : ''">
          <h1 class="text-lg font-serif font-bold text-[#1C1C1E]">SGAOA</h1>
          <p class="text-xs text-gray-500">Adoption</p>
        </div>
      </div>
      <!-- Toggle Button -->
      <button (click)="toggleSidebar()" class="p-1 rounded-lg hover:bg-gray-100 transition-colors hidden lg:block"
        [class]="isSidebarCollapsed() ? 'hidden' : ''">
        <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7">
          </path>
        </svg>
      </button>
    </div>

    <!-- Navigation Menu -->
    <nav class="p-4">
      <ul class="space-y-2">
        <!-- Dashboard -->
        <li>
          <a routerLink="/dashboard/adoptant"
            [class]="isSidebarCollapsed() ? 'flex items-center justify-center px-4 py-3 rounded-xl bg-[#4A7C59]/10 text-[#4A7C59] font-medium transition-all duration-200' : 'flex items-center gap-3 px-4 py-3 rounded-xl bg-[#4A7C59]/10 text-[#4A7C59] font-medium transition-all duration-200'"
            routerLinkActive="bg-[#4A7C59]/10 text-[#4A7C59]">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
              </path>
            </svg>
            <span [class]="isSidebarCollapsed() ? 'hidden' : ''">Dashboard</span>
          </a>
        </li>

        <!-- Mon Profil -->
        <li>
          <a routerLink="/dashboard/adoptant/profil"
            [class]="isSidebarCollapsed() ? 'flex items-center justify-center px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-[#4A7C59] font-medium transition-all duration-200' : 'flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-[#4A7C59] font-medium transition-all duration-200'"
            routerLinkActive="bg-[#4A7C59]/10 text-[#4A7C59]">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            <span [class]="isSidebarCollapsed() ? 'hidden' : ''">Mon Profil</span>
          </a>
        </li>

        <!-- Mes Demandes -->
        <li>
          <a routerLink="/dashboard/adoptant/demandes"
            [class]="isSidebarCollapsed() ? 'flex items-center justify-center px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-[#4A7C59] font-medium transition-all duration-200' : 'flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-[#4A7C59] font-medium transition-all duration-200'"
            routerLinkActive="bg-[#4A7C59]/10 text-[#4A7C59]">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
              </path>
            </svg>
            <span [class]="isSidebarCollapsed() ? 'hidden' : ''">Mes Demandes</span>
          </a>
        </li>

        <!-- Mes Documents -->
        <li>
          <a routerLink="/dashboard/adoptant/documents"
            [class]="isSidebarCollapsed() ? 'flex items-center justify-center px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-[#4A7C59] font-medium transition-all duration-200' : 'flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-[#4A7C59] font-medium transition-all duration-200'"
            routerLinkActive="bg-[#4A7C59]/10 text-[#4A7C59]">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
            </svg>
            <span [class]="isSidebarCollapsed() ? 'hidden' : ''">Mes Documents</span>
          </a>
        </li>

        <!-- Notifications -->
        <li>
          <a routerLink="/dashboard/adoptant/notifications"
            [class]="isSidebarCollapsed() ? 'flex items-center justify-center px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-[#4A7C59] font-medium transition-all duration-200' : 'flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-[#4A7C59] font-medium transition-all duration-200'"
            routerLinkActive="bg-[#4A7C59]/10 text-[#4A7C59]">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9">
              </path>
            </svg>
            <span [class]="isSidebarCollapsed() ? 'hidden' : ''">Notifications</span>
          </a>
        </li>

        <!-- Divider -->
        <li [class]="isSidebarCollapsed() ? 'hidden' : 'pt-4 border-t border-gray-100 mt-4'">
          <p class="px-4 text-xs text-gray-400 uppercase tracking-wider mb-2">Compte</p>
        </li>

        <!-- Paramètres -->
        <li>
          <a routerLink="/dashboard/adoptant/parametres"
            [class]="isSidebarCollapsed() ? 'flex items-center justify-center px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-[#4A7C59] font-medium transition-all duration-200' : 'flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-[#4A7C59] font-medium transition-all duration-200'"
            routerLinkActive="bg-[#4A7C59]/10 text-[#4A7C59]">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
              </path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <span [class]="isSidebarCollapsed() ? 'hidden' : ''">Paramètres</span>
          </a>
        </li>

        <!-- Déconnexion -->
        <li>
          <button (click)="logout()"
            [class]="isSidebarCollapsed() ? 'w-full flex items-center justify-center px-4 py-3 rounded-xl text-red-600 hover:bg-red-50 font-medium transition-all duration-200' : 'w-full flex items-center gap-3 px-4 py-3 rounded-xl text-red-600 hover:bg-red-50 font-medium transition-all duration-200'">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
            <span [class]="isSidebarCollapsed() ? 'hidden' : ''">Se déconnecter</span>
          </button>
        </li>
      </ul>
    </nav>

    <!-- User Info at Bottom -->
    <div
      [class]="isSidebarCollapsed() ? 'absolute bottom-0 left-0 right-0 p-4 border-t border-gray-100 bg-white flex justify-center' : 'absolute bottom-0 left-0 right-0 p-4 border-t border-gray-100 bg-white'">
      <div [class]="isSidebarCollapsed() ? '' : 'flex items-center gap-3'">
        <div
          class="w-10 h-10 rounded-full bg-[#4A7C59] flex items-center justify-center text-white font-semibold text-sm flex-shrink-0">
          {{ getInitials() }}
        </div>
        <div [class]="isSidebarCollapsed() ? 'hidden' : 'flex-1 min-w-0'">
          <p class="text-sm font-semibold text-[#1C1C1E] truncate">{{ currentUser()?.prenom }} {{ currentUser()?.nom }}
          </p>
          <p class="text-xs text-gray-500 truncate">{{ currentUser()?.email }}</p>
        </div>
      </div>
      <!-- Expand Button (visible when collapsed) -->
      <button (click)="toggleSidebar()"
        [class]="isSidebarCollapsed() ? 'absolute bottom-4 right-4 p-1 rounded-lg hover:bg-gray-100 transition-colors' : 'hidden'">
        <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path>
        </svg>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div
    [class]="isSidebarCollapsed() ? 'flex-1 lg:ml-20 transition-all duration-300' : 'flex-1 lg:ml-64 transition-all duration-300'">
    <!-- Header -->
    <div class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
        <div class="flex justify-between items-center">
          <div class="flex items-center gap-4">
            <!-- Mobile Menu Button -->
            <button class="lg:hidden p-2 rounded-lg hover:bg-gray-100 transition-colors">
              <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                </path>
              </svg>
            </button>
            <h1 class="text-2xl font-serif font-bold text-[#1C1C1E]">Dashboard Adoptant</h1>
          </div>
          <div class="flex items-center gap-4">
            <p class="text-gray-600 text-sm font-medium hidden sm:block">{{ getCurrentDate() }}</p>
            <!-- Mobile Avatar -->
            <div
              class="lg:hidden w-9 h-9 rounded-full bg-[#4A7C59] flex items-center justify-center text-white font-semibold text-sm">
              {{ getInitials() }}
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Router Outlet for child components -->
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
