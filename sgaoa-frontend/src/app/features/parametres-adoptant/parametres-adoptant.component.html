<!-- Header -->
<div class="mb-8">
  <h1 class="text-3xl font-serif font-bold text-[#1C1C1E]">Paramètres</h1>
  <p class="text-gray-600 mt-2">Gérez vos paramètres de compte</p>
</div>

<!-- Settings Cards -->
<div class="space-y-6">
  <!-- Change Password -->
  <div class="bg-white rounded-2xl shadow-sm ring-1 ring-gray-100 p-6">
    <h2 class="text-xl font-semibold text-[#1C1C1E] mb-4">Changer le mot de passe</h2>
    <div *ngIf="!showPasswordForm()">
      <button (click)="togglePasswordForm()"
        class="bg-[#4A7C59] text-white px-6 py-2 rounded-lg hover:bg-opacity-90 transition-all">
        Changer le mot de passe
      </button>
    </div>
    <div *ngIf="showPasswordForm()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Mot de passe actuel</label>
        <input type="password" [(ngModel)]="currentPassword"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#4A7C59] focus:border-transparent">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Nouveau mot de passe</label>
        <input type="password" [(ngModel)]="newPassword"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#4A7C59] focus:border-transparent">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Confirmer le nouveau mot de passe</label>
        <input type="password" [(ngModel)]="confirmPassword"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#4A7C59] focus:border-transparent">
      </div>
      <div class="flex gap-4">
        <button (click)="changePassword()"
          class="bg-[#4A7C59] text-white px-6 py-2 rounded-lg hover:bg-opacity-90 transition-all">
          Enregistrer
        </button>
        <button (click)="togglePasswordForm()"
          class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 transition-all">
          Annuler
        </button>
      </div>
    </div>
  </div>

  <!-- Logout -->
  <div class="bg-white rounded-2xl shadow-sm ring-1 ring-gray-100 p-6">
    <h2 class="text-xl font-semibold text-[#1C1C1E] mb-4">Déconnexion</h2>
    <p class="text-gray-600 mb-4">Vous serez déconnecté de votre compte</p>
    <button (click)="logout()" class="bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700 transition-all">
      Se déconnecter
    </button>
  </div>
</div>
