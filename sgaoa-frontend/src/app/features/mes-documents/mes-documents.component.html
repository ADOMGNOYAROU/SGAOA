<!-- Header -->
<div class="mb-8">
  <h1 class="text-3xl font-serif font-bold text-[#1C1C1E]">Mes Documents</h1>
  <p class="text-gray-600 mt-2">Gérez vos documents d'adoption</p>
</div>

<!-- Documents List -->
@if (isLoading()) {
<div class="text-center py-12">
  <p class="text-gray-500">Chargement...</p>
</div>
} @else if (documents().length === 0) {
<div class="bg-white rounded-2xl shadow-sm ring-1 ring-gray-100 p-12 text-center">
  <svg class="w-16 h-16 text-[#D4862A] mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
      d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z">
    </path>
  </svg>
  <p class="text-gray-500 text-lg">Aucun document pour le moment</p>
</div>
} @else {
<div class="space-y-4">
  @for (document of documents(); track document.id) {
  <div class="bg-white rounded-2xl shadow-sm ring-1 ring-gray-100 p-6 hover:shadow-md transition-all">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-4">
        <svg class="w-10 h-10 text-[#D4862A]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
          </path>
        </svg>
        <div>
          <h3 class="text-lg font-semibold text-[#1C1C1E]">{{ document.nom }}</h3>
          <p class="text-gray-500 text-sm">{{ document.date }}</p>
        </div>
      </div>
      <button class="text-[#4A7C59] hover:text-[#4A7C59]/80 font-medium">
        Télécharger
      </button>
    </div>
  </div>
  }
</div>
}
